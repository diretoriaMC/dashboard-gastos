name: Bot Gastos - Telegram

on:
  # Roda a cada 2 minutos para verificar mensagens novas
  schedule:
    - cron: '*/2 * * * *'
  # Permite disparar manualmente
  workflow_dispatch:

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por poppler-utils
          pip install --quiet \
            requests \
            pdfplumber \
            pytesseract \
            Pillow \
            anthropic

      - name: Processar mensagens e atualizar dashboard
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/processar_bot.py

      - name: Commitar dashboard atualizado
        run: |
          git config user.name "Bot Gastos"
          git config user.email "bot@gastos"
          git add index.html estado_bot.json contas_fixas.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar"
          else
            git commit -m "Auto-update via Telegram $(date '+%d/%m/%Y %H:%M')"
            git push
          fi
