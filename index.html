<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gastos · Leonardo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;color:#1f2937}

/* HEADER */
.header{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;padding:28px 20px 48px}
.header small{color:#c4b5fd;font-size:12px;display:block;margin-bottom:14px}
.header-saldo-label{color:#c4b5fd;font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.header-saldo{font-size:38px;font-weight:800;margin-bottom:10px}
.header-pills{display:flex;gap:8px;flex-wrap:wrap}
.header-pill{background:rgba(255,255,255,.15);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600}
.header-pill.green{background:rgba(34,197,94,.25)}
.header-pill.red{background:rgba(239,68,68,.25)}
.header-acum-label{color:#c4b5fd;font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-top:14px;margin-bottom:2px}
.header-acum-wrap{display:flex;align-items:baseline;gap:8px}
.header-acum{font-size:22px;font-weight:700}
.header-acum-tag{font-size:10px;color:#c4b5fd;background:rgba(255,255,255,.12);border-radius:99px;padding:2px 8px;font-weight:600;letter-spacing:.4px;align-self:center}

/* NAVEGAÇÃO DE MÊS/ANO */
.month-nav-bar{background:white;border-radius:18px;display:flex;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.12);margin-bottom:14px;overflow:hidden;border:2px solid #ede9fe}
.month-nav-bar button{background:transparent;border:none;cursor:pointer;transition:.15s;line-height:1;flex-shrink:0}
.month-nav-bar button:hover{background:#f5f3ff}
.month-nav-bar button:disabled{color:#d1d5db;cursor:default}
.month-nav-bar button:disabled:hover{background:transparent}
.month-nav-bar h2{flex:1;text-align:center;font-size:16px;font-weight:700;color:#4c1d95;letter-spacing:.3px}
.btn-mes{color:#7c3aed;font-size:26px;font-weight:700;padding:14px 16px}
.btn-ano{color:#a78bfa;font-size:18px;font-weight:700;padding:14px 10px}
.nav-divider{width:1px;height:28px;background:#ede9fe;flex-shrink:0}

/* WRAP */
.wrap{max-width:520px;margin:-28px auto 0;padding:0 16px 40px}

/* TABS */
.tabs{background:white;border-radius:16px;display:flex;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
.tab{flex:1;padding:13px 6px;font-size:13px;font-weight:500;border:none;background:transparent;color:#6b7280;cursor:pointer;border-radius:16px;transition:.2s}
.tab.active{background:#7c3aed;color:white}

/* CARD */
.card{background:white;border-radius:18px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #f3f4f6;margin-bottom:14px}
.card h2{font-size:14px;font-weight:600;color:#374151;margin-bottom:12px}

/* STATS GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat-card{background:white;border-radius:18px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #f3f4f6}
.stat-label{font-size:11px;color:#9ca3af;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:800;color:#1f2937}
.stat-val.green{color:#16a34a}
.stat-val.red{color:#dc2626}

/* SALDO CARD */
.saldo-card{border-radius:18px;padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.saldo-card.pos{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border:1px solid #86efac}
.saldo-card.neg{background:linear-gradient(135deg,#fee2e2,#fecaca);border:1px solid #fca5a5}
.saldo-card .saldo-info small{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.saldo-card.pos .saldo-info small{color:#15803d}
.saldo-card.neg .saldo-info small{color:#b91c1c}
.saldo-card .saldo-val{font-size:28px;font-weight:800}
.saldo-card.pos .saldo-val{color:#15803d}
.saldo-card.neg .saldo-val{color:#b91c1c}
.saldo-card .saldo-icon{font-size:36px}

/* RECEITA BARRA */
.rec-row{margin-bottom:10px}
.rec-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.rec-bg{background:#dcfce7;border-radius:99px;height:10px}
.rec-fill{height:10px;border-radius:99px;background:linear-gradient(90deg,#22c55e,#16a34a)}
.rec-pct{text-align:right;font-size:11px;color:#9ca3af;margin-top:3px}

/* BARRA CATEGORIA */
.bar-row{margin-bottom:12px}
.bar-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-bg{background:#f3f4f6;border-radius:99px;height:8px}
.bar-fill{height:8px;border-radius:99px}
.bar-pct{text-align:right;font-size:11px;color:#9ca3af;margin-top:3px}

/* CATEGORIA EXPANDÍVEL */
.cat-clickable{cursor:pointer;padding:6px 8px;border-radius:8px;transition:background .15s}
.cat-clickable:hover{background:#f8fafc}
.cat-expanded{margin:-6px 0 14px 0;padding:8px 10px;background:#f8fafc;border-radius:10px;border-left:3px solid #e2e8f0}
.cat-tx-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:white;border-radius:10px;margin-bottom:6px;border:1px solid #f1f5f9}
.cat-tx-info{flex:1;overflow:hidden;min-width:0}
.cat-tx-info b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-tx-info small{font-size:10.5px;color:#94a3b8;display:block}
.cat-tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;position:relative}
.cat-tx-right b{font-size:12.5px;font-weight:700}

/* BADGE DE PARCELA */
.parcela-badge{display:inline-block;font-size:10px;font-weight:600;background:#ddd6fe;color:#5b21b6;padding:1px 6px;border-radius:10px;margin-left:4px;letter-spacing:.3px;vertical-align:middle}

/* GASTO EXTRAORDINÁRIO */
.cat-tx-item.tx-extra{background:#fffbeb;border-color:#fde68a;border-left:3px solid #f59e0b}
.extra-btn{font-size:11.5px;padding:3px 7px;border-radius:14px;border:1px solid #fde68a;background:#fffbeb;cursor:pointer;line-height:1;filter:grayscale(100%);opacity:.55;transition:all .15s}
.extra-btn:hover{opacity:1;filter:none}
.extra-btn.active{filter:none;opacity:1;background:#fef3c7;border-color:#f59e0b}

/* BOTÃO RECATEGORIZAR */
.recat-btn{font-size:10.5px;padding:3px 8px;border-radius:14px;border:1px solid #c7d2fe;background:#eef2ff;color:#4338ca;cursor:pointer;font-weight:600;white-space:nowrap}
.recat-btn:hover{background:#e0e7ff}
.recat-menu{position:absolute;top:100%;right:0;margin-top:6px;background:white;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:100;min-width:180px;max-height:320px;overflow-y:auto}
.recat-header{font-size:11px;font-weight:600;color:#6b7280;padding:6px 10px 8px;border-bottom:1px solid #f3f4f6;margin-bottom:4px}
.recat-opt{padding:7px 10px;font-size:12.5px;border-radius:7px;cursor:pointer;transition:background .15s}
.recat-opt:hover{background:#f3f4f6}
.recat-clear{border-top:1px solid #f3f4f6;margin-top:4px;padding-top:8px;color:#6366f1;font-weight:500}
.recat-new{border-top:1px solid #f3f4f6;margin-top:4px;padding-top:8px;color:#059669;font-weight:600}
.recat-del{float:right;background:none;border:none;color:#9ca3af;font-size:14px;cursor:pointer;padding:0 4px;line-height:1}
.recat-del:hover{color:#ef4444}

/* FORMULÁRIO NOVA CATEGORIA */
.recat-menu .cat-form{padding:8px 6px}
.recat-menu .cat-form input{display:block;width:100%;padding:6px 9px;font-size:12.5px;border:1px solid #e5e7eb;border-radius:7px;margin-bottom:6px;box-sizing:border-box}
.recat-menu .cat-form input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px #c7d2fe}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:6px 0;max-height:140px;overflow-y:auto;padding:4px;background:#f9fafb;border-radius:7px}
.emoji-pick{display:flex;align-items:center;justify-content:center;font-size:18px;padding:5px;border-radius:5px;cursor:pointer;transition:background .15s}
.emoji-pick:hover{background:#e0e7ff}
.btn-criar{flex:1;padding:7px;border:none;border-radius:7px;background:#10b981;color:white;font-weight:600;font-size:12.5px;cursor:pointer}
.btn-criar:hover{background:#059669}
.btn-cancelar{flex:1;padding:7px;border:1px solid #e5e7eb;border-radius:7px;background:white;color:#6b7280;font-weight:500;font-size:12.5px;cursor:pointer}
.btn-cancelar:hover{background:#f9fafb}

/* ADICIONAR / EDITAR / EXCLUIR */
.card-head-flex{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-head-flex h2{margin:0}
.add-mini{font-size:12px;font-weight:600;padding:5px 12px;border-radius:16px;border:none;background:#6366f1;color:#fff;cursor:pointer;white-space:nowrap}
.add-mini:hover{background:#4f46e5}
.edit-btn,.del-btn{font-size:11px;padding:3px 7px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;line-height:1}
.edit-btn:hover{background:#eef2ff;border-color:#c7d2fe}
.del-btn:hover{background:#fef2f2;border-color:#fecaca}
.tx-actions{display:flex;gap:4px;margin-top:5px;justify-content:flex-end}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:380px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{font-size:16px;font-weight:700;color:#1e293b;margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:11px}
.modal label input[type=text],.modal label input[type=number],.modal label input[type=date],.modal label input[type=month],.modal label select{display:block;width:100%;margin-top:4px;padding:9px 11px;font-size:14px;border:1px solid #e2e8f0;border-radius:9px;box-sizing:border-box;font-weight:400;color:#1e293b;background:#fff}
.modal label input:focus,.modal label select:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px #c7d2fe}
.modal-check{display:flex!important;align-items:center;gap:8px;font-weight:500!important;color:#374151!important;font-size:13px!important}
.modal-check input{width:auto!important;margin:0!important}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.btn-salvar{flex:1;padding:11px;border:none;border-radius:10px;background:#10b981;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.btn-salvar:hover{background:#059669}
.btn-cancel{flex:1;padding:11px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;color:#64748b;font-weight:600;font-size:14px;cursor:pointer}
.btn-cancel:hover{background:#f8fafc}

/* STATUS DE SINCRONIZAÇÃO */
#sync-status{position:fixed;bottom:16px;right:16px;background:rgba(30,41,59,.92);color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;z-index:2000;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:opacity .4s;pointer-events:none}

/* GERENCIAR CATEGORIAS */
.gc-sec-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:10px}
.gc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gc-chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:#374151;background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:4px 10px}
.gc-del{background:none;border:none;color:#9ca3af;font-size:15px;line-height:1;cursor:pointer;padding:0 0 0 2px;font-weight:700}
.gc-del:hover{color:#ef4444}
.gc-form{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.gc-form input[type=text]{flex:1;padding:8px 10px;font-size:13px;border:1px solid #e2e8f0;border-radius:8px;box-sizing:border-box}
.gc-form input[type=text]:nth-of-type(2){flex:0 0 56px;text-align:center}
.gc-form input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px #c7d2fe}
.gc-form .btn-criar{flex:0 0 auto;padding:8px 14px}

/* TOP 5 */
.top-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#f9fafb;margin-bottom:7px}
.top-rank{font-size:13px;font-weight:800;color:#d1d5db;width:22px;flex-shrink:0}
.top-info{flex:1;overflow:hidden}
.top-info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-info small{font-size:11px;color:#9ca3af}
.top-val{font-weight:700;font-size:13px;white-space:nowrap}

/* COMPARAÇÃO */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.compare-box{border-radius:12px;padding:12px;text-align:center}
.compare-box.prev{background:#f9fafb;border:1px solid #f3f4f6}
.compare-box.curr{background:#f5f3ff;border:1px solid #ede9fe}
.compare-box small{font-size:11px;color:#9ca3af;display:block;margin-bottom:3px}
.compare-box.curr small{color:#8b5cf6}
.compare-box big{font-size:20px;font-weight:800;color:#374151}
.compare-box.curr big{color:#7c3aed}
.compare-diff{text-align:center;font-size:13px;font-weight:600;padding:4px 0}

/* GASTOS */
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid #e5e7eb;font-size:13px;outline:none;margin-bottom:10px}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid #e5e7eb;background:white;color:#6b7280;cursor:pointer}
.filter-btn.active{background:#7c3aed;color:white;border-color:#7c3aed}

/* STACK */
.stack-group{position:relative;margin-bottom:20px;cursor:pointer}
.stack-group .behind{position:absolute;width:100%;border-radius:14px;background:white;border:1px solid #f3f4f6;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stack-group .behind.b1{top:5px;left:4px;width:calc(100% - 8px);opacity:.7}
.stack-group .behind.b2{top:9px;left:8px;width:calc(100% - 16px);opacity:.45}
.stack-count{position:absolute;top:-6px;right:-6px;background:#7c3aed;color:white;border-radius:99px;font-size:11px;font-weight:700;padding:2px 7px;z-index:10;box-shadow:0 2px 4px rgba(124,58,237,.4)}

/* TX ITEM */
.tx-item{background:white;border-radius:14px;border:1px solid #f3f4f6;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative;z-index:5}
.tx-item.sub{border-radius:12px;background:#fafafa;margin-top:6px;box-shadow:none;border-color:#ede9fe}
.tx-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tx-info{flex:1;overflow:hidden}
.tx-info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-info small{font-size:11px;color:#9ca3af;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-right{text-align:right;flex-shrink:0}
.tx-right b{font-size:14px;font-weight:700;display:block;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;color:white}
.expand-hint{text-align:center;font-size:11px;color:#8b5cf6;padding:6px 0 2px;font-weight:500}

/* GRÁFICOS */
.chart-wrap{overflow-x:auto;padding:4px 0}
.pie-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.pie-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#374151}
.pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* SEÇÕES */
.section{display:none}
.section.visible{display:block}
.empty{text-align:center;color:#9ca3af;padding:40px 20px;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <small>Leonardo · Controle Financeiro</small>

  <div class="header-saldo" id="hd-saldo"></div>

<div class="wrap">

  <div id="sec-resumo" class="section visible"></div>

</div>

  ])].sort();

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────────
function navMes(dir) {
  mesIdx = Math.max(0, Math.min(todosOsMeses.length-1, mesIdx+dir));
  expandidos.clear();
  render();
}
function navAno(dir) {
  const [y, m] = todosOsMeses[mesIdx].split("-");
  const targetYear = parseInt(y) + dir;
  const targetKey  = `${targetYear}-${m}`;
  // Tenta o mesmo mês no ano alvo
  let idx = todosOsMeses.indexOf(targetKey);
  if (idx === -1) {
    // Busca o mês mais próximo dentro do ano alvo
    const candidatos = todosOsMeses
      .map((k, i) => ({ k, i }))
      .filter(x => x.k.startsWith(String(targetYear) + "-"));
    if (candidatos.length === 0) return; // Ano não existe
    idx = candidatos.reduce((best, cur) => {
      const diff = v => Math.abs(parseInt(v.k.split("-")[1]) - parseInt(m));
      return diff(cur) < diff(best) ? cur : best;
    }).i;
  }
  mesIdx = idx;
  expandidos.clear();
  render();
}
// ── SINCRONIZAÇÃO COM A PLANILHA (Google Apps Script) ────────────────────────
// Todos os ajustes manuais ficam aqui e são salvos na planilha, sincronizando
// entre todos os aparelhos. localStorage serve só como cache offline.
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyDQnmhQTdo6SrIO58cqXl0yHVKw3YMbSpqIW3TtX68gfgNjDLcZzWUFRVJh7zmzEo7/exec";

function _mergeAjustes(data) {
  AJUSTES = {
    cat_overrides:   data.cat_overrides   || {},
    extraordinarios: data.extraordinarios || [],
    cats_custom:     data.cats_custom     || {},
    negocios_custom: data.negocios_custom || {},
    tx_deletados:    data.tx_deletados    || [],
    tx_editados:     data.tx_editados     || {},
    tx_adicionados:  data.tx_adicionados  || [],
    rec_deletados:   data.rec_deletados   || [],
    rec_editados:    data.rec_editados    || {},
    rec_adicionados: data.rec_adicionados || []
  };
}

async function carregarAjustes() {
  try {
    const r = await fetch(WEBAPP_URL + "?t=" + Date.now());
    _mergeAjustes(await r.json());
    localStorage.setItem("ajustes_cache", JSON.stringify(AJUSTES));
  } catch (e) {
    try { _mergeAjustes(JSON.parse(localStorage.getItem("ajustes_cache") || "{}")); } catch {}
    mostrarStatusSync("⚠️ Sem conexão — usando dados deste aparelho");
  }
}

let _saveTimer = null;
function salvarAjustes() {
  localStorage.setItem("ajustes_cache", JSON.stringify(AJUSTES));
  mostrarStatusSync("💾 Salvando...");
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    fetch(WEBAPP_URL, { method: "POST", body: JSON.stringify(AJUSTES) })
      .then(r => r.json())
      .then(() => mostrarStatusSync("✅ Sincronizado"))
      .catch(() => mostrarStatusSync("⚠️ Falha ao sincronizar — salvo neste aparelho"));
  }, 600);
}

function mostrarStatusSync(txt) {
  let el = document.getElementById("sync-status");
  if (!el) { el = document.createElement("div"); el.id = "sync-status"; document.body.appendChild(el); }
  el.textContent = txt;
  el.style.opacity = "1";
  clearTimeout(el._t);
  if (txt.startsWith("✅")) el._t = setTimeout(() => { el.style.opacity = "0"; }, 1800);
}

const ADD_TX_BASE = 9000000; // ids de despesas adicionadas manualmente começam aqui
function escAttr(s){ return String(s==null?"":s).replace(/"/g,"&quot;"); }

// — Despesas —
function getTxDeletados(){ return new Set(AJUSTES.tx_deletados); }
function getTxEditados(){ return AJUSTES.tx_editados; }
function getTxAdicionados(){ return AJUSTES.tx_adicionados; }
function saveTxDeletados(s){ AJUSTES.tx_deletados = [...s]; salvarAjustes(); }
function saveTxEditados(o){ AJUSTES.tx_editados = o; salvarAjustes(); }
function saveTxAdicionados(a){ AJUSTES.tx_adicionados = a; salvarAjustes(); }
function txEfetivas(){
  const del = getTxDeletados();
  const ed  = getTxEditados();
  const base = ALL_TX.filter(t=>!del.has(t.id)).map(t=> ed[t.id] ? {...t, ...ed[t.id], _editado:true} : t);
  return [...base, ...getTxAdicionados()];
}
function setExtra(id, on){
  const s = getExtras(); if(on) s.add(id); else s.delete(id);
  AJUSTES.extraordinarios = [...s];
  salvarAjustes();
}

// — Receitas (identificadas por handle _h) —
function getRecDeletados(){ return new Set(AJUSTES.rec_deletados); }
function getRecEditados(){ return AJUSTES.rec_editados; }
function getRecAdicionados(){ return AJUSTES.rec_adicionados; }
function saveRecDeletados(s){ AJUSTES.rec_deletados = [...s]; salvarAjustes(); }
function saveRecEditados(o){ AJUSTES.rec_editados = o; salvarAjustes(); }
function saveRecAdicionados(a){ AJUSTES.rec_adicionados = a; salvarAjustes(); }
function recEfetivas(){
  const del = getRecDeletados();
  const ed  = getRecEditados();
  const base = ALL_RECEITAS.filter(r=>!del.has(recKey(r))).map(r=>{
    const k = recKey(r);
    const obj = ed[k] ? {...r, ...ed[k], _editado:true} : {...r};
    obj._h = "base|" + k;
    return obj;
  });
  const add = getRecAdicionados().map(r=>({...r, _h:"add|"+r._addid}));
  return [...base, ...add];
}

// — Ações de exclusão —
function excluirTx(id){
  if(window.event) window.event.stopPropagation();
  if(!confirm("Excluir este lançamento de despesa?")) return;
  if(id >= ADD_TX_BASE){
    saveTxAdicionados(getTxAdicionados().filter(t=>t.id!==id));
  } else {
    const d = getTxDeletados(); d.add(id); saveTxDeletados(d);
  }
  const ed = getTxEditados(); delete ed[id]; saveTxEditados(ed);
  removerOverride(id);
  setExtra(id, false);
  render();
}
function excluirReceita(h){
  if(window.event) window.event.stopPropagation();
  if(!confirm("Excluir esta receita?")) return;
  if(h.startsWith("add|")){
    const id = h.slice(4);
    saveRecAdicionados(getRecAdicionados().filter(r=>String(r._addid)!==id));
  } else {
    const origKey = h.slice(5);
    const d = getRecDeletados(); d.add(origKey); saveRecDeletados(d);
    const ed = getRecEditados(); delete ed[origKey]; saveRecEditados(ed);
  }
  render();
}

      <div class="modal-btns">
        <button class="btn-salvar" onclick="salvarTx(${novo?'null':id})">Salvar</button>
        <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  setTimeout(()=>document.getElementById("f-valor")?.focus(), 50);

function salvarTx(id){
  const data  = document.getElementById("f-data").value;
  const valor = parseFloat(document.getElementById("f-valor").value);
  const estab = document.getElementById("f-estab").value.trim();
  const desc  = document.getElementById("f-desc").value.trim();
  const cat   = document.getElementById("f-cat").value;
  const pag   = document.getElementById("f-pag").value;
  const parc  = document.getElementById("f-parc").value.trim();
  const extra = document.getElementById("f-extra").checked;
  const semc  = document.getElementById("f-semc").checked;
  if(!data || isNaN(valor) || valor<=0){ alert("Preencha uma data e um valor válido."); return; }
  if(!desc && !estab){ alert("Preencha ao menos a descrição ou o estabelecimento."); return; }
  const campos = {
    data, valor,
    estabelecimento: estab || desc,
    descricao: desc || estab,
    categoria: cat,
    pagamento: pag,
    parcela: parc,
    semComprovante: semc
  };
  if(id==null){
    const novoId = ADD_TX_BASE + (Date.now() % 1000000000);
    const add = getTxAdicionados();
    add.push({id: novoId, ...campos});
    saveTxAdicionados(add);
    setExtra(novoId, extra);
  } else if(id >= ADD_TX_BASE){
    saveTxAdicionados(getTxAdicionados().map(t=> t.id===id ? {id, ...campos} : t));
    setExtra(id, extra);
  } else {
    const ed = getTxEditados(); ed[id] = campos; saveTxEditados(ed);
    removerOverride(id);  // a edição define a categoria diretamente
    setExtra(id, extra);
  }
  fecharModal();
  render();
}

  const fontes = [...new Set([...Object.keys(getAllNegocios()), ...ALL_RECEITAS.map(x=>x.fonte), ...getRecAdicionados().map(x=>x.fonte)])];
  const emojiAtual = r ? getNegocioConfig(r.fonte).icone : "💼";
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  ov.onclick = e => { if(e.target===ov) fecharModal(); };
  ov.innerHTML = `
    <div class="modal">
      <div class="modal-head">${novo?"➕ Nova receita":"✏️ Editar receita"}</div>
      <label>Mês<input type="month" id="r-mes" value="${mesVal}"></label>
      <label>Fonte<input type="text" id="r-fonte" list="fontes-list" value="${r?escAttr(r.fonte):''}" placeholder="Ex: Lavanderia">

      <label>Valor (R$)<input type="number" step="0.01" min="0" id="r-valor" value="${r?r.valor:''}" placeholder="0,00"></label>

        <button class="btn-salvar" onclick="salvarReceita(${novo?'null':`'${h.replace(/'/g,"\\'")}'`})">Salvar</button>
        <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  setTimeout(()=>document.getElementById("r-fonte")?.focus(), 50);
}
function salvarReceita(h){
  const mes   = document.getElementById("r-mes").value;
  const fonte = document.getElementById("r-fonte").value.trim();
  const emoji = document.getElementById("r-emoji").value.trim();
  const valor = parseFloat(document.getElementById("r-valor").value);
  if(!mes || !fonte || isNaN(valor) || valor<=0){ alert("Preencha mês, fonte e um valor válido."); return; }
  // Se a fonte ainda não existe, cria com o emoji escolhido
  if(!getAllNegocios()[fonte]) criarNegocio(fonte, emoji || "💼");
  if(h==null){
    const add = getRecAdicionados();
    add.push({mes, fonte, valor, _addid: Date.now()});
    saveRecAdicionados(add);
  } else if(h.startsWith("add|")){
    const id = h.slice(4);
    saveRecAdicionados(getRecAdicionados().map(r=> String(r._addid)===id ? {...r, mes, fonte, valor} : r));
  } else {
    const origKey = h.slice(5);
    const ed = getRecEditados(); ed[origKey] = {mes, fonte, valor}; saveRecEditados(ed);
  }
  fecharModal();
  render();
}

const categoriasAbertas = new Set();

function mesAtual()     { return todosOsMeses[mesIdx]; }
function txDoMes(k)     { return aplicarExtras(aplicarOverrides(txEfetivas().filter(t=>mesKey(t.data)===k))); }
function recDoMes(k)    { return recEfetivas().filter(r=>r.mes===k); }

// ── AGRUPAMENTO ───────────────────────────────────────────────────────────────
function agrupar(txs) {
  const map = {};
  txs.forEach(t => {
    const key = t.grupo || ("_solo_"+t.id);
    if(!map[key]) map[key] = [];
    map[key].push(t);
  });
  return Object.values(map)
    .map(g => g.sort((a,b)=>b.data.localeCompare(a.data)))
    .sort((a,b)=>b[0].data.localeCompare(a[0].data));
}

// ── RENDER PRINCIPAL ──────────────────────────────────────────────────────────
function render() {
  // Recalcula os meses disponíveis (lançamentos manuais podem criar meses novos)
  const kAntes = todosOsMeses[mesIdx];
  todosOsMeses = calcMeses();
  mesIdx = todosOsMeses.indexOf(kAntes);
  if(mesIdx < 0) mesIdx = todosOsMeses.indexOf(MES_HOJE);
  if(mesIdx < 0) mesIdx = todosOsMeses.length - 1;

  const k       = mesAtual();
  const txs     = txDoMes(k);
  const recs    = recDoMes(k);
  const totalGasto       = txs.reduce((s,t)=>s+t.valor, 0);
  const totalOrdinario   = txs.filter(t=>!t._extraordinario).reduce((s,t)=>s+t.valor, 0);
  const totalExtraord    = txs.filter(t=>t._extraordinario).reduce((s,t)=>s+t.valor, 0);
  const totalReceita     = recs.reduce((s,r)=>s+r.valor, 0);
  const saldo            = totalReceita - totalGasto;
  const saldoOrdinario   = totalReceita - totalOrdinario;
  const prev             = txMesAnterior();
  const prevTotal        = prev ? prev.reduce((s,t)=>s+t.valor,0) : null;

  // Saldo acumulado (a partir de 2026-04)
  const INICIO_ACUM = "2026-04";
  const acumReceita = recEfetivas().filter(r => r.mes >= INICIO_ACUM && r.mes <= k).reduce((s,r)=>s+r.valor, 0);
  const acumGasto   = aplicarOverrides(txEfetivas()).filter(t => mesKey(t.data) >= INICIO_ACUM && mesKey(t.data) <= k).reduce((s,t)=>s+t.valor, 0);
  const saldoAcum   = acumReceita - acumGasto;

  // Header
  document.getElementById("mes-label").textContent       = mesLabel(k);
  document.getElementById("hd-saldo").textContent        = fmt(saldo);
  document.getElementById("hd-saldo").style.color        = saldo >= 0 ? "#a7f3d0" : "#fca5a5";
  document.getElementById("hd-receita").textContent      = "📈 Receitas: "+fmt(totalReceita);
  document.getElementById("hd-gasto").innerHTML          = totalExtraord > 0
    ? `💸 Gastos: ${fmt(totalGasto)} <small style="opacity:.85">(ord: ${fmt(totalOrdinario)} · extra: ${fmt(totalExtraord)})</small>`
    : `💸 Gastos: ${fmt(totalGasto)}`;
  document.getElementById("hd-saldo-acum").textContent   = fmt(saldoAcum);
  document.getElementById("hd-saldo-acum").style.color   = saldoAcum >= 0 ? "#a7f3d0" : "#fca5a5";
  document.getElementById("btn-prev").disabled = mesIdx===0;
  document.getElementById("btn-next").disabled = mesIdx===todosOsMeses.length-1;
  const anoAtual  = parseInt(todosOsMeses[mesIdx].split("-")[0]);
  document.getElementById("btn-prev-ano").disabled = !todosOsMeses.some(k=>parseInt(k.split("-")[0]) < anoAtual);
  document.getElementById("btn-next-ano").disabled = !todosOsMeses.some(k=>parseInt(k.split("-")[0]) > anoAtual);

  renderResumo(txs, recs, totalGasto, totalReceita, saldo, prevTotal, k, totalOrdinario, totalExtraord, saldoOrdinario);
  renderGastos(txs);
  renderGraficos(txs, recs, totalGasto, totalReceita);
}

// ── RESUMO ────────────────────────────────────────────────────────────────────
function renderResumo(txs, recs, totalGasto, totalReceita, saldo, prevTotal, k, totalOrdinario, totalExtraord, saldoOrdinario) {
  const byCat = {};
  txs.forEach(t=>{ byCat[t.categoria]=(byCat[t.categoria]||0)+t.valor; });
  const catArr = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const todosOrdenados = [...txs].sort((a,b)=>b.valor-a.valor);
  const maxRec = recs.length ? Math.max(...recs.map(r=>r.valor)) : 1;

  const saldoPos = saldo >= 0;
  const saldoOrdPos = saldoOrdinario >= 0;

  // Card saldo
  const saldoCard = `
    <div class="saldo-card ${saldoPos?"pos":"neg"}">
      <div class="saldo-info">
        <small>${saldoPos?"✅ Saldo Positivo":"⚠️ Saldo Negativo"}</small>
        <div class="saldo-val">${fmt(Math.abs(saldo))}</div>
        ${totalExtraord > 0 ? `
          <small style="display:block;margin-top:6px;opacity:.85">
            Sem extraordinários: <b style="color:${saldoOrdPos?'#a7f3d0':'#fca5a5'}">${saldoOrdPos?'+':'-'}${fmt(Math.abs(saldoOrdinario))}</b>
          </small>` : ""}
      </div>
      <div class="saldo-icon">${saldoPos?"💰":"📉"}</div>
    </div>`;

  // Receitas card
  const recCard = `
    <div class="card">
      <div class="card-head-flex">
        <h2>📈 Receitas por Negócio</h2>
        <button class="add-mini" onclick="abrirModalReceita(null)">+ Receita</button>
      </div>
      ${recs.length ? recs.map(r=>{
        const pct=(r.valor/totalReceita*100).toFixed(1);
        const cfg=getNegocioConfig(r.fonte);
        const hEsc = r._h.replace(/'/g,"\\'");
        return `<div class="rec-row">
          <div class="rec-row-top">
            <span style="color:#374151">${cfg.icone} ${r.fonte}${r._editado?' <span style="color:#6366f1;font-size:10px">✎</span>':''}</span>
            <span style="display:flex;align-items:center;gap:6px">
              <b style="font-weight:600">${fmt(r.valor)}</b>
              <button class="edit-btn" onclick="abrirModalReceita('${hEsc}')" title="Editar">✏️</button>
              <button class="del-btn" onclick="excluirReceita('${hEsc}')" title="Excluir">🗑️</button>
            </span>
          </div>
          <div class="rec-bg"><div class="rec-fill" style="width:${pct}%;background:${cfg.cor}"></div></div>
        </div>`;
      }).join("") + `
      <div style="border-top:1px solid #f3f4f6;margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:13px">
        <span style="color:#6b7280">Total</span>
        <span style="font-weight:700;color:#16a34a">${fmt(totalReceita)}</span>
      </div>` : '<p class="empty" style="padding:14px 8px">Nenhuma receita neste mês. Clique em "+ Receita" para adicionar.</p>'}
    </div>`;

  // Comparação
  const prev = txMesAnterior();
  const varHtml = prevTotal != null ? (() => {
    const diff=totalGasto-prevTotal;
    const pct=(diff/prevTotal*100).toFixed(1);
    const cor=diff>0?"#ef4444":"#22c55e";
    const seta=diff>0?"▲":"▼";
    return `<div class="compare-diff" style="color:${cor}">${seta} ${fmt(Math.abs(diff))} (${Math.abs(pct)}%) ${diff>0?"a mais":"a menos"} em gastos que ${mesLabel(todosOsMeses[mesIdx-1])}</div>`;
  })() : `<p style="text-align:center;font-size:11px;color:#9ca3af;margin-top:8px">Adicione dados de outros meses para comparar</p>`;

  const prevBox = prevTotal != null ? `
    <div class="compare-box prev">
      <small>${mesLabel(todosOsMeses[mesIdx-1])}</small>
      <big>${fmt(prevTotal)}</big>
    </div>` : "";

  document.getElementById("sec-resumo").innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button class="add-mini" style="background:#475569" onclick="abrirModalCategorias()">🏷️ Gerenciar categorias</button>
    </div>
    ${saldoCard}

    <div class="grid2">
      <div class="stat-card">
        <div class="stat-label">Receita Total</div>
        <div class="stat-val green">${totalReceita?fmt(totalReceita):"—"}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total de Gastos</div>
        <div class="stat-val red">${totalGasto?fmt(totalGasto):"—"}</div>
        ${totalExtraord > 0 ? `
          <div style="margin-top:8px;padding-top:8px;border-top:1px dashed #fee2e2;font-size:11px;line-height:1.5">
            <div style="display:flex;justify-content:space-between"><span style="color:#6b7280">Ordinário</span><b>${fmt(totalOrdinario)}</b></div>
            <div style="display:flex;justify-content:space-between"><span style="color:#d97706">⭐ Extraordinário</span><b style="color:#d97706">${fmt(totalExtraord)}</b></div>
          </div>` : ""}
      </div>
    </div>

    ${recCard}

    <div class="card">
      <div class="card-head-flex">
        <h2>💸 Gastos por Categoria</h2>
        <button class="add-mini" onclick="abrirModalTx(null)">+ Despesa</button>
      </div>
      ${catArr.map(([name,value])=>{
        const pct=(value/totalGasto*100).toFixed(1);
        const cor=getCatConfig(name).cor;
        const ico=getCatConfig(name).icone;
        const aberta = categoriasAbertas.has(name);
        const txsCat = txs.filter(t=>t.categoria===name).sort((a,b)=>b.valor-a.valor);
        return `
        <div class="bar-row cat-clickable" onclick="toggleCatExp('${name.replace(/'/g,"\\'")}')">
          <div class="bar-row-top">
            <span>${aberta?"▼":"▶"} ${ico} ${name} <small style="color:#94a3b8;font-weight:500">(${txsCat.length})</small></span>
            <span>${fmt(value)}</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${cor}"></div></div>
          <div class="bar-pct">${pct}%</div>
        </div>
        ${aberta ? `<div class="cat-expanded">
          ${txsCat.map(t => `
            <div class="cat-tx-item${t._extraordinario?' tx-extra':''}">
              <div class="cat-tx-info">
                <b>${t._extraordinario?'⭐ ':''}${t.descricao}${t.parcela?` <span class="parcela-badge">${t.parcela}</span>`:''}</b>
                <small>${t.estabelecimento} · ${fmtD(t.data)} · ${t.pagamento}${t._reclassificado?' · <span style="color:#6366f1">✎ reclassificado</span>':''}${t._extraordinario?' · <span style="color:#d97706;font-weight:600">extraordinário</span>':''}</small>
              </div>
              <div class="cat-tx-right">
                <b>${fmt(t.valor)}</b>
                <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
                  <button class="extra-btn${t._extraordinario?' active':''}" onclick="toggleExtra(${t.id})" title="${t._extraordinario?'Desmarcar como extraordinário':'Marcar como extraordinário'}">⭐</button>
                  <button class="recat-btn" onclick="abrirMenuRecat(${t.id}, this)">🏷 Mover</button>
                  <button class="edit-btn" onclick="abrirModalTx(${t.id})" title="Editar">✏️</button>
                  <button class="del-btn" onclick="excluirTx(${t.id})" title="Excluir">🗑️</button>
                </div>
              </div>
            </div>
          `).join("")}
        </div>` : ""}`;
      }).join("")||'<p class="empty">Sem gastos registrados</p>'}
    </div>

    <div class="card">
      <h2>💸 Todos os Gastos do Mês (${todosOrdenados.length})</h2>
      ${todosOrdenados.map((t,i)=>`
        <div class="top-item">
          <div class="top-rank">#${i+1}</div>
          <div class="top-info"><b>${t.descricao}${t.parcela?` <span class="parcela-badge">${t.parcela}</span>`:''}</b><small>${t.estabelecimento} · ${fmtD(t.data)} · ${t.pagamento}</small></div>
          <div class="top-val">${fmt(t.valor)}</div>
        </div>`).join("")||'<p class="empty">Sem dados</p>'}
    </div>

    <div class="card">
      <h2>📅 Comparação Mensal (Gastos)</h2>
      <div class="compare-grid">
        ${prevBox}
        <div class="compare-box curr">
          <small>${mesLabel(k)} ✦</small>
          <big>${fmt(totalGasto)}</big>
        </div>
      </div>
      ${varHtml}
    </div>`;
}

// ── GASTOS ────────────────────────────────────────────────────────────────────
function renderGastos(txs) {
  const catsPresentes = [...new Set(txs.map(t=>t.categoria))];
  const filtradas = txs.filter(t=>
    (filtroAtivo==="Todas"||t.categoria===filtroAtivo)&&
    (busca===""||t.descricao.toLowerCase().includes(busca.toLowerCase())||
     t.estabelecimento.toLowerCase().includes(busca.toLowerCase()))
  );

  const cardHtml = t => {
    const cor=getCatConfig(t.categoria).cor;
    const ico=getCatConfig(t.categoria).icone;
    return `
      <div class="tx-item" style="${t.semComprovante?'border-left:3px solid #f59e0b;':''}">
        <div class="tx-icon" style="background:${cor}22">${ico}</div>
        <div class="tx-info">
          <b>${t.descricao}${t.parcela?` <span class="parcela-badge">${t.parcela}</span>`:''}</b>
          <small>${t.estabelecimento}</small>
          <small>${fmtD(t.data)} · ${t.pagamento}${t.semComprovante?' · <span style="color:#d97706;font-weight:600">⚠ sem comprovante</span>':''}</small>
        </div>
        <div class="tx-right">
          <b>${fmt(t.valor)}</b>
          <span class="badge" style="background:${cor}">${ico} ${t.categoria}</span>
          <div class="tx-actions">
            <button class="edit-btn" onclick="event.stopPropagation();abrirModalTx(${t.id})" title="Editar">✏️</button>
            <button class="del-btn" onclick="event.stopPropagation();excluirTx(${t.id})" title="Excluir">🗑️</button>
          </div>
        </div>
      </div>`;
  };

  const filterBtns = ["Todas",...catsPresentes].map(cat=>`
    <button class="filter-btn${cat===filtroAtivo?" active":""}"
      onclick="setFiltro('${cat}')">${((getCatConfig(cat).icone||""))} ${cat}</button>`).join("");

  const toggleView = `
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <span style="font-size:13px;color:#6b7280;font-weight:500">Visualizar:</span>
      <button onclick="setViewMode('categoria')" style="
        padding:5px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;
        background:${viewMode==='categoria'?'#6366f1':'#f1f5f9'};
        color:${viewMode==='categoria'?'#fff':'#64748b'};transition:all .2s">
        📂 Por categoria
      </button>
      <button onclick="setViewMode('cronologico')" style="
        padding:5px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;
        background:${viewMode==='cronologico'?'#6366f1':'#f1f5f9'};
        color:${viewMode==='cronologico'?'#fff':'#64748b'};transition:all .2s">
        📅 Cronológico
      </button>
    </div>`;

  let conteudoHtml = '';

  if (viewMode === 'cronologico') {
    // Agrupa por dia, ordena do mais recente ao mais antigo
    const porDia = {};
    [...filtradas].sort((a,b)=>b.data.localeCompare(a.data)).forEach(t => {
      const dia = t.data;
      if (!porDia[dia]) porDia[dia] = [];
      porDia[dia].push(t);
    });

    if (!Object.keys(porDia).length) {
      conteudoHtml = '<p class="empty">Nenhum gasto encontrado</p>';
    } else {
      conteudoHtml = Object.entries(porDia).map(([dia, items]) => {
        const totalDia = items.reduce((s,t)=>s+t.valor, 0);
        // Formata o dia com nome do dia da semana
        const d = new Date(dia + 'T12:00:00');
        const nomeDia = d.toLocaleDateString('pt-BR', {weekday:'long'});
        const diaCurto = fmtD(dia);
        return `
          <div style="margin-bottom:18px">
            <div style="display:flex;justify-content:space-between;align-items:center;
              padding:6px 12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;
              border-left:4px solid #6366f1">
              <div>
                <span style="font-weight:700;color:#1e293b;font-size:14px">${diaCurto}</span>
                <span style="color:#94a3b8;font-size:12px;margin-left:8px;text-transform:capitalize">${nomeDia}</span>
              </div>
              <span style="font-weight:700;color:#6366f1;font-size:14px">${fmt(totalDia)}</span>
            </div>
            ${items.map(t => cardHtml(t)).join('')}
          </div>`;
      }).join('');
    }
  } else {
    // Modo por categoria (comportamento original com agrupamento/stacks)
    const grupos = agrupar(filtradas);
    if (!grupos.length) {
      conteudoHtml = '<p class="empty">Nenhum gasto encontrado</p>';
    } else {
      conteudoHtml = grupos.map(grupo => {
        const top=grupo[0];
        const key=top.grupo||("_solo_"+top.id);
        const multi=grupo.length>1;
        const isExp=expandidos.has(key);
        const cor=getCatConfig(top.categoria).cor;
        const totalGrupo=grupo.reduce((s,t)=>s+t.valor,0);

        if(!multi) return `<div style="margin-bottom:8px">${cardHtml(top)}</div>`;

        const backs = !isExp ? `
          <div class="behind b1"></div>
          ${grupo.length>2?'<div class="behind b2"></div>':''}` : "";

        return `
          <div class="stack-group" onclick="toggleStack('${key}')">
            ${backs}
            <span class="stack-count">${grupo.length}x · ${fmt(totalGrupo)}</span>
            ${cardHtml(top)}
            ${isExp ? grupo.slice(1).map(t=>cardHtml(t)).join("") : ""}
            <div class="expand-hint">${isExp?"▲ Recolher":"▼ Ver todos os "+grupo.length+" lançamentos"}</div>
          </div>`;
      }).join("");
    }
  }

  document.getElementById("sec-gastos").innerHTML = `
    <input class="search" type="text" placeholder="🔍 Buscar..." value="${busca}" oninput="setBusca(this.value)"/>
    ${toggleView}
    <div class="filter-row">${filterBtns}</div>
    ${conteudoHtml}`;
}

// ── GRÁFICOS ──────────────────────────────────────────────────────────────────
function renderGraficos(txs, recs, totalGasto, totalReceita) {
  const semDados = !txs.length && !recs.length;
  if(semDados){
    document.getElementById("sec-grafico").innerHTML='<p class="empty" style="padding:60px 20px">Sem dados para este mês</p>';
    return;
  }

  // Receita vs Gasto
  const maxRG = Math.max(totalReceita, totalGasto) || 1;
  const recVsGastoHtml = `
    <div class="card">
      <h2>📊 Receita × Gasto</h2>
      ${[["📈 Receita","#22c55e",totalReceita],["💸 Gastos","#ef4444",totalGasto]].map(([label,cor,val])=>`
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
            <span style="color:#374151">${label}</span><span style="font-weight:600;color:${cor}">${fmt(val)}</span>
          </div>
          <div style="background:#f3f4f6;border-radius:99px;height:12px">
            <div style="width:${(val/maxRG*100).toFixed(0)}%;height:12px;border-radius:99px;background:${cor}"></div>
          </div>
        </div>`).join("")}
      <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:8px;border-top:1px solid #f3f4f6">
        <span style="color:#6b7280">Saldo</span>
        <span style="font-weight:700;color:${totalReceita>=totalGasto?"#16a34a":"#dc2626"}">${fmt(totalReceita-totalGasto)}</span>
      </div>
    </div>`;

  // Pizza gastos
  let pieSlices="",legItems="",angle=0;
  const byCat={};
  txs.forEach(t=>{ byCat[t.categoria]=(byCat[t.categoria]||0)+t.valor; });
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  catArr.forEach(([name,value])=>{
    const pct=value/totalGasto;
    const a1=angle*Math.PI*2, a2=(angle+pct)*Math.PI*2;
    const x1=Math.cos(a1),y1=Math.sin(a1),x2=Math.cos(a2),y2=Math.sin(a2);
    const large=pct>.5?1:0;
    const cor=getCatConfig(name).cor;
    const R=0.9,r=0.45;
    pieSlices+=`<path d="M${R*x1},${R*y1} A${R},${R} 0 ${large} 1 ${R*x2},${R*y2} L${r*x2},${r*y2} A${r},${r} 0 ${large} 0 ${r*x1},${r*y1} Z" fill="${cor}"/>`;
    legItems+=`<div class="pie-legend-item"><div class="pie-dot" style="background:${cor}"></div>${getCatConfig(name).icone} ${name} (${(pct*100).toFixed(1)}%)</div>`;
    angle+=pct;
  });

  // Barras gastos
  const maxCat=catArr.length?catArr[0][1]:1;
  const barsHtml=catArr.map(([name,value])=>{
    const pct=(value/maxCat*100).toFixed(0);
    const cor=getCatConfig(name).cor;
    const ico=getCatConfig(name).icone;
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:90px;font-size:12px;text-align:right;flex-shrink:0;color:#374151">${ico} ${name}</div>
      <div style="flex:1;background:#f3f4f6;border-radius:99px;height:24px">
        <div style="width:${pct}%;min-width:1%;height:100%;border-radius:99px;background:${cor};display:flex;align-items:center;justify-content:flex-end;padding-right:8px">
          <span style="font-size:11px;color:white;font-weight:600">${fmt(value)}</span>
        </div>
      </div>
    </div>`;
  }).join("");

  // Área por dia
  const byDay={};
  txs.forEach(t=>{ const d=fmtD(t.data); byDay[d]=(byDay[d]||0)+t.valor; });
  const days=Object.entries(byDay);
  let areaSvg="";
  if(days.length){
    const W=460,H=140,pl=50,pr=20,pt=20,pb=30;
    const maxDay=Math.max(...days.map(d=>d[1]));
    const pts=days.map(([d,v],i)=>({
      x:pl+(i/(Math.max(days.length-1,1)))*(W-pl-pr),
      y:pt+(1-v/maxDay)*(H-pt-pb), d, v
    }));
    const aPath=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(" ")
      +` L${pts[pts.length-1].x},${H-pb} L${pts[0].x},${H-pb} Z`;
    areaSvg=`<div class="card"><h2>Gastos por Dia</h2><div class="chart-wrap">
      <svg width="${W}" height="${H}" style="display:block">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7c3aed" stop-opacity=".3"/>
          <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${aPath}" fill="url(#ag)"/>
        <polyline points="${pts.map(p=>`${p.x},${p.y}`).join(" ")}" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#7c3aed"/>`).join("")}
        ${pts.map(p=>`<text x="${p.x}" y="${H-8}" text-anchor="middle" font-size="11" fill="#9ca3af">${p.d}</text>`).join("")}
        ${pts.map(p=>`<text x="${p.x}" y="${p.y-10}" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="600">R$${p.v.toFixed(0)}</text>`).join("")}
        <line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="#e5e7eb"/>
        <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#e5e7eb"/>
      </svg>
    </div></div>`;
  }

  document.getElementById("sec-grafico").innerHTML = `
    ${recVsGastoHtml}
    ${catArr.length?`
    <div class="card">
      <h2>Distribuição dos Gastos</h2>
      <div style="display:flex;justify-content:center">
        <svg width="200" height="200" viewBox="-1 -1 2 2" style="transform:rotate(-90deg)">${pieSlices}</svg>
      </div>
      <div class="pie-legend">${legItems}</div>
    </div>
    <div class="card"><h2>Gastos por Categoria</h2>${barsHtml}</div>`:""}
    ${areaSvg}`;
}

// ── INTERAÇÕES ────────────────────────────────────────────────────────────────
function setFiltro(cat)    { filtroAtivo=cat;  renderGastos(txDoMes(mesAtual())); }
function setBusca(v)       { busca=v;         renderGastos(txDoMes(mesAtual())); }
function setViewMode(mode) { viewMode=mode;   renderGastos(txDoMes(mesAtual())); }
function toggleStack(key){
  if(expandidos.has(key)) expandidos.delete(key); else expandidos.add(key);
  renderGastos(txDoMes(mesAtual()));
}
function showAba(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("visible"));
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  document.getElementById("sec-"+id).classList.add("visible");
  btn.classList.add("active");
}

// Carrega os ajustes da planilha e só então renderiza
render(); // render inicial imediato com os dados do bot (rápido)
carregarAjustes().then(render); // recarrega já com os ajustes sincronizados
</script>
</body>
