<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;color:#1f2937}

/* HEADER */
.header{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;padding:28px 20px 48px}
.header small{color:#c4b5fd;font-size:12px;display:block;margin-bottom:14px}
.header-saldo-label{color:#c4b5fd;font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.header-saldo{font-size:38px;font-weight:800;margin-bottom:10px}
.header-pills{display:flex;gap:8px;flex-wrap:wrap}
.header-pill{background:rgba(255,255,255,.15);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600}
.header-pill.green{background:rgba(34,197,94,.25)}
.header-pill.red{background:rgba(239,68,68,.25)}
.header-acum-label{color:#c4b5fd;font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-top:14px;margin-bottom:2px}
.header-acum-wrap{display:flex;align-items:baseline;gap:8px}
.header-acum{font-size:22px;font-weight:700}
.header-acum-tag{font-size:10px;color:#c4b5fd;background:rgba(255,255,255,.12);border-radius:99px;padding:2px 8px;font-weight:600;letter-spacing:.4px;align-self:center}

/* NAVEGAÇÃO DE MÊS/ANO */
.month-nav-bar{background:white;border-radius:18px;display:flex;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.12);margin-bottom:14px;overflow:hidden;border:2px solid #ede9fe}
.month-nav-bar button{background:transparent;border:none;cursor:pointer;transition:.15s;line-height:1;flex-shrink:0}
.month-nav-bar button:hover{background:#f5f3ff}
.month-nav-bar button:disabled{color:#d1d5db;cursor:default}
.month-nav-bar button:disabled:hover{background:transparent}
.month-nav-bar h2{flex:1;text-align:center;font-size:16px;font-weight:700;color:#4c1d95;letter-spacing:.3px}
.btn-mes{color:#7c3aed;font-size:26px;font-weight:700;padding:14px 16px}
.btn-ano{color:#a78bfa;font-size:18px;font-weight:700;padding:14px 10px}
.nav-divider{width:1px;height:28px;background:#ede9fe;flex-shrink:0}

/* WRAP */
.wrap{max-width:520px;margin:-28px auto 0;padding:0 16px 40px}

/* TABS */
.tabs{background:white;border-radius:16px;display:flex;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
.tab{flex:1;padding:13px 6px;font-size:13px;font-weight:500;border:none;background:transparent;color:#6b7280;cursor:pointer;border-radius:16px;transition:.2s}
.tab.active{background:#7c3aed;color:white}

/* CARD */
.card{background:white;border-radius:18px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #f3f4f6;margin-bottom:14px}
.card h2{font-size:14px;font-weight:600;color:#374151;margin-bottom:12px}

/* STATS GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat-card{background:white;border-radius:18px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #f3f4f6}
.stat-label{font-size:11px;color:#9ca3af;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:800;color:#1f2937}
.stat-val.green{color:#16a34a}
.stat-val.red{color:#dc2626}

/* SALDO CARD */
.saldo-card{border-radius:18px;padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.saldo-card.pos{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border:1px solid #86efac}
.saldo-card.neg{background:linear-gradient(135deg,#fee2e2,#fecaca);border:1px solid #fca5a5}
.saldo-card .saldo-info small{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.saldo-card.pos .saldo-info small{color:#15803d}
.saldo-card.neg .saldo-info small{color:#b91c1c}
.saldo-card .saldo-val{font-size:28px;font-weight:800}
.saldo-card.pos .saldo-val{color:#15803d}
.saldo-card.neg .saldo-val{color:#b91c1c}
.saldo-card .saldo-icon{font-size:36px}

/* RECEITA BARRA */
.rec-row{margin-bottom:10px}
.rec-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.rec-bg{background:#dcfce7;border-radius:99px;height:10px}
.rec-fill{height:10px;border-radius:99px;background:linear-gradient(90deg,#22c55e,#16a34a)}
.rec-pct{text-align:right;font-size:11px;color:#9ca3af;margin-top:3px}

/* BARRA CATEGORIA */
.bar-row{margin-bottom:12px}
.bar-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-bg{background:#f3f4f6;border-radius:99px;height:8px}
.bar-fill{height:8px;border-radius:99px}
.bar-pct{text-align:right;font-size:11px;color:#9ca3af;margin-top:3px}

/* TOP 5 */
.top-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#f9fafb;margin-bottom:7px}
.top-rank{font-size:13px;font-weight:800;color:#d1d5db;width:22px;flex-shrink:0}
.top-info{flex:1;overflow:hidden}
.top-info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-info small{font-size:11px;color:#9ca3af}
.top-val{font-weight:700;font-size:13px;white-space:nowrap}

/* COMPARAÇÃO */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.compare-box{border-radius:12px;padding:12px;text-align:center}
.compare-box.prev{background:#f9fafb;border:1px solid #f3f4f6}
.compare-box.curr{background:#f5f3ff;border:1px solid #ede9fe}
.compare-box small{font-size:11px;color:#9ca3af;display:block;margin-bottom:3px}
.compare-box.curr small{color:#8b5cf6}
.compare-box big{font-size:20px;font-weight:800;color:#374151}
.compare-box.curr big{color:#7c3aed}
.compare-diff{text-align:center;font-size:13px;font-weight:600;padding:4px 0}

/* GASTOS */
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid #e5e7eb;font-size:13px;outline:none;margin-bottom:10px}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid #e5e7eb;background:white;color:#6b7280;cursor:pointer}
.filter-btn.active{background:#7c3aed;color:white;border-color:#7c3aed}

/* STACK */
.stack-group{position:relative;margin-bottom:20px;cursor:pointer}
.stack-group .behind{position:absolute;width:100%;border-radius:14px;background:white;border:1px solid #f3f4f6;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stack-group .behind.b1{top:5px;left:4px;width:calc(100% - 8px);opacity:.7}
.stack-group .behind.b2{top:9px;left:8px;width:calc(100% - 16px);opacity:.45}
.stack-count{position:absolute;top:-6px;right:-6px;background:#7c3aed;color:white;border-radius:99px;font-size:11px;font-weight:700;padding:2px 7px;z-index:10;box-shadow:0 2px 4px rgba(124,58,237,.4)}

/* TX ITEM */
.tx-item{background:white;border-radius:14px;border:1px solid #f3f4f6;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative;z-index:5}
.tx-item.sub{border-radius:12px;background:#fafafa;margin-top:6px;box-shadow:none;border-color:#ede9fe}
.tx-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tx-info{flex:1;overflow:hidden}
.tx-info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-info small{font-size:11px;color:#9ca3af;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-right{text-align:right;flex-shrink:0}
.tx-right b{font-size:14px;font-weight:700;display:block;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;color:white}
.expand-hint{text-align:center;font-size:11px;color:#8b5cf6;padding:6px 0 2px;font-weight:500}

/* GRÁFICOS */
.chart-wrap{overflow-x:auto;padding:4px 0}
.pie-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.pie-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#374151}
.pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* SEÇÕES */
.section{display:none}
.section.visible{display:block}
.empty{text-align:center;color:#9ca3af;padding:40px 20px;font-size:14px}
</style>

const NEGOCIOS = {
  "Lavanderia": { cor:"#0ea5e9", icone:"👔" },
  "Pousada":    { cor:"#f59e0b", icone:"🏨" },
};

const MESES_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const fmt    = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtD   = d => { const [,m,day]=d.split("-"); return day+"/"+m; };
const mesKey = d => d.slice(0,7);
const mesLabel = k => { const [y,m]=k.split("-"); return MESES_PT[+m-1]+" "+y; };

// União de todos os meses com dados (gastos ou receitas) + mês atual
const MES_HOJE = mesKey(new Date().toISOString());
const todosOsMeses = [...new Set([
  ...ALL_TX.map(t=>mesKey(t.data)),
  ...ALL_RECEITAS.map(r=>r.mes),
  MES_HOJE  // garante que o mês atual sempre aparece, mesmo sem dados
])].sort();

// Abre sempre no mês atual
let mesIdx = todosOsMeses.indexOf(MES_HOJE);
let filtroAtivo = "Todas";
let busca = "";
let viewMode = "categoria"; // "categoria" ou "cronologico"
const expandidos = new Set();

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────────
function navMes(dir) {
  mesIdx = Math.max(0, Math.min(todosOsMeses.length-1, mesIdx+dir));
  expandidos.clear();
  render();
}
function navAno(dir) {
  const [y, m] = todosOsMeses[mesIdx].split("-");
  const targetYear = parseInt(y) + dir;
  const targetKey  = `${targetYear}-${m}`;
  // Tenta o mesmo mês no ano alvo
  let idx = todosOsMeses.indexOf(targetKey);
  if (idx === -1) {
    // Busca o mês mais próximo dentro do ano alvo
    const candidatos = todosOsMeses
      .map((k, i) => ({ k, i }))
      .filter(x => x.k.startsWith(String(targetYear) + "-"));
    if (candidatos.length === 0) return; // Ano não existe
    idx = candidatos.reduce((best, cur) => {
      const diff = v => Math.abs(parseInt(v.k.split("-")[1]) - parseInt(m));
      return diff(cur) < diff(best) ? cur : best;
    }).i;
  }
  mesIdx = idx;
  expandidos.clear();
  render();
}
function mesAtual()     { return todosOsMeses[mesIdx]; }
function txDoMes(k)     { return ALL_TX.filter(t=>mesKey(t.data)===k); }
function recDoMes(k)    { return ALL_RECEITAS.filter(r=>r.mes===k); }
function txMesAnterior(){ return mesIdx===0 ? null : txDoMes(todosOsMeses[mesIdx-1]); }

// ── AGRUPAMENTO ───────────────────────────────────────────────────────────────
function agrupar(txs) {
  const map = {};
  txs.forEach(t => {
    const key = t.grupo || ("_solo_"+t.id);
    if(!map[key]) map[key] = [];
    map[key].push(t);
  });
  return Object.values(map)
    .map(g => g.sort((a,b)=>b.data.localeCompare(a.data)))
    .sort((a,b)=>b[0].data.localeCompare(a[0].data));
}

// ── RENDER PRINCIPAL ──────────────────────────────────────────────────────────
function render() {
  const k       = mesAtual();
  const txs     = txDoMes(k);
  const recs    = recDoMes(k);
  const totalGasto   = txs.reduce((s,t)=>s+t.valor, 0);
  const totalReceita = recs.reduce((s,r)=>s+r.valor, 0);
  const saldo        = totalReceita - totalGasto;
  const prev         = txMesAnterior();
  const prevTotal    = prev ? prev.reduce((s,t)=>s+t.valor,0) : null;

  // Saldo acumulado (a partir de 2026-04)
  const INICIO_ACUM = "2026-04";
  const acumReceita = ALL_RECEITAS.filter(r => r.mes >= INICIO_ACUM && r.mes <= k).reduce((s,r)=>s+r.valor, 0);
  const acumGasto   = ALL_TX.filter(t => mesKey(t.data) >= INICIO_ACUM && mesKey(t.data) <= k).reduce((s,t)=>s+t.valor, 0);
  const saldoAcum   = acumReceita - acumGasto;

  // Header
  document.getElementById("mes-label").textContent       = mesLabel(k);
  document.getElementById("hd-saldo").textContent        = fmt(saldo);
  document.getElementById("hd-saldo").style.color        = saldo >= 0 ? "#a7f3d0" : "#fca5a5";
  document.getElementById("hd-receita").textContent      = "📈 Receitas: "+fmt(totalReceita);
  document.getElementById("hd-gasto").textContent        = "💸 Gastos: "+fmt(totalGasto);
  document.getElementById("hd-saldo-acum").textContent   = fmt(saldoAcum);
  document.getElementById("hd-saldo-acum").style.color   = saldoAcum >= 0 ? "#a7f3d0" : "#fca5a5";
  document.getElementById("btn-prev").disabled = mesIdx===0;
  document.getElementById("btn-next").disabled = mesIdx===todosOsMeses.length-1;
  const anoAtual  = parseInt(todosOsMeses[mesIdx].split("-")[0]);
  document.getElementById("btn-prev-ano").disabled = !todosOsMeses.some(k=>parseInt(k.split("-")[0]) < anoAtual);
  document.getElementById("btn-next-ano").disabled = !todosOsMeses.some(k=>parseInt(k.split("-")[0]) > anoAtual);

  renderResumo(txs, recs, totalGasto, totalReceita, saldo, prevTotal, k);
  renderGastos(txs);
  renderGraficos(txs, recs, totalGasto, totalReceita);
}

  // Comparação
  const prev = txMesAnterior();

  const prevBox = prevTotal != null ? `
    <div class="compare-box prev">
      <small>${mesLabel(todosOsMeses[mesIdx-1])}</small>
      <big>${fmt(prevTotal)}</big>

  document.getElementById("sec-resumo").innerHTML = `
    ${saldoCard}

    <div class="grid2">
      <div class="stat-card">
        <div class="stat-label">Receita Total</div>
        <div class="stat-val green">${totalReceita?fmt(totalReceita):"—"}</div>

// ── GASTOS ────────────────────────────────────────────────────────────────────
function renderGastos(txs) {
  const catsPresentes = [...new Set(txs.map(t=>t.categoria))];
  const filtradas = txs.filter(t=>
    (filtroAtivo==="Todas"||t.categoria===filtroAtivo)&&
    (busca===""||t.descricao.toLowerCase().includes(busca.toLowerCase())||
     t.estabelecimento.toLowerCase().includes(busca.toLowerCase()))
  );

  const cardHtml = t => {
    const cor=CATS[t.categoria]?.cor||"#6b7280";
    const ico=CATS[t.categoria]?.icone||"📦";
    return `
      <div class="tx-item" style="${t.semComprovante?'border-left:3px solid #f59e0b;':''}">
        <div class="tx-icon" style="background:${cor}22">${ico}</div>
        <div class="tx-info">
          <b>${t.descricao}</b>
          <small>${t.estabelecimento}</small>
          <small>${fmtD(t.data)} · ${t.pagamento}${t.semComprovante?' · <span style="color:#d97706;font-weight:600">⚠ sem comprovante</span>':''}</small>
        </div>
        <div class="tx-right">
          <b>${fmt(t.valor)}</b>
          <span class="badge" style="background:${cor}">${ico} ${t.categoria}</span>
        </div>
      </div>`;
  };

  const filterBtns = ["Todas",...catsPresentes].map(cat=>`
    <button class="filter-btn${cat===filtroAtivo?" active":""}"
      onclick="setFiltro('${cat}')">${(CATS[cat]?.icone||"")} ${cat}</button>`).join("");

  const toggleView = `
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <span style="font-size:13px;color:#6b7280;font-weight:500">Visualizar:</span>
      <button onclick="setViewMode('categoria')" style="
        padding:5px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;
        background:${viewMode==='categoria'?'#6366f1':'#f1f5f9'};
        color:${viewMode==='categoria'?'#fff':'#64748b'};transition:all .2s">
        📂 Por categoria
      </button>
      <button onclick="setViewMode('cronologico')" style="
        padding:5px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;
        background:${viewMode==='cronologico'?'#6366f1':'#f1f5f9'};
        color:${viewMode==='cronologico'?'#fff':'#64748b'};transition:all .2s">
        📅 Cronológico
      </button>
    </div>`;

  let conteudoHtml = '';

  if (viewMode === 'cronologico') {
    // Agrupa por dia, ordena do mais recente ao mais antigo
    const porDia = {};
    [...filtradas].sort((a,b)=>b.data.localeCompare(a.data)).forEach(t => {
      const dia = t.data;
      if (!porDia[dia]) porDia[dia] = [];
      porDia[dia].push(t);
    });

    if (!Object.keys(porDia).length) {
      conteudoHtml = '<p class="empty">Nenhum gasto encontrado</p>';
    } else {
      conteudoHtml = Object.entries(porDia).map(([dia, items]) => {
        const totalDia = items.reduce((s,t)=>s+t.valor, 0);
        // Formata o dia com nome do dia da semana
        const d = new Date(dia + 'T12:00:00');
        const nomeDia = d.toLocaleDateString('pt-BR', {weekday:'long'});
        const diaCurto = fmtD(dia);
        return `
          <div style="margin-bottom:18px">
            <div style="display:flex;justify-content:space-between;align-items:center;
              padding:6px 12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;
              border-left:4px solid #6366f1">
              <div>
                <span style="font-weight:700;color:#1e293b;font-size:14px">${diaCurto}</span>
                <span style="color:#94a3b8;font-size:12px;margin-left:8px;text-transform:capitalize">${nomeDia}</span>
              </div>
              <span style="font-weight:700;color:#6366f1;font-size:14px">${fmt(totalDia)}</span>
            </div>
            ${items.map(t => cardHtml(t)).join('')}
          </div>`;
      }).join('');
    }
  } else {
    // Modo por categoria (comportamento original com agrupamento/stacks)
    const grupos = agrupar(filtradas);
    if (!grupos.length) {
      conteudoHtml = '<p class="empty">Nenhum gasto encontrado</p>';
    } else {
      conteudoHtml = grupos.map(grupo => {
        const top=grupo[0];
        const key=top.grupo||("_solo_"+top.id);
        const multi=grupo.length>1;
        const isExp=expandidos.has(key);
        const cor=CATS[top.categoria]?.cor||"#6b7280";
        const totalGrupo=grupo.reduce((s,t)=>s+t.valor,0);

        if(!multi) return `<div style="margin-bottom:8px">${cardHtml(top)}</div>`;

        const backs = !isExp ? `
          <div class="behind b1"></div>
          ${grupo.length>2?'<div class="behind b2"></div>':''}` : "";

        return `
          <div class="stack-group" onclick="toggleStack('${key}')">
            ${backs}
            <span class="stack-count">${grupo.length}x · ${fmt(totalGrupo)}</span>
            ${cardHtml(top)}
            ${isExp ? grupo.slice(1).map(t=>cardHtml(t)).join("") : ""}
            <div class="expand-hint">${isExp?"▲ Recolher":"▼ Ver todos os "+grupo.length+" lançamentos"}</div>
          </div>`;
      }).join("");
    }
  }

  document.getElementById("sec-gastos").innerHTML = `
    <input class="search" type="text" placeholder="🔍 Buscar..." value="${busca}" oninput="setBusca(this.value)"/>
    ${toggleView}
    <div class="filter-row">${filterBtns}</div>
    ${conteudoHtml}`;
}

// ── GRÁFICOS ──────────────────────────────────────────────────────────────────
function renderGraficos(txs, recs, totalGasto, totalReceita) {
  const semDados = !txs.length && !recs.length;
  if(semDados){
    document.getElementById("sec-grafico").innerHTML='<p class="empty" style="padding:60px 20px">Sem dados para este mês</p>';
    return;
  }

  // Receita vs Gasto
  const maxRG = Math.max(totalReceita, totalGasto) || 1;
  const recVsGastoHtml = `
    <div class="card">
      <h2>📊 Receita × Gasto</h2>
      ${[["📈 Receita","#22c55e",totalReceita],["💸 Gastos","#ef4444",totalGasto]].map(([label,cor,val])=>`
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
            <span style="color:#374151">${label}</span><span style="font-weight:600;color:${cor}">${fmt(val)}</span>
          </div>
          <div style="background:#f3f4f6;border-radius:99px;height:12px">
            <div style="width:${(val/maxRG*100).toFixed(0)}%;height:12px;border-radius:99px;background:${cor}"></div>
          </div>
        </div>`).join("")}
      <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:8px;border-top:1px solid #f3f4f6">
        <span style="color:#6b7280">Saldo</span>
        <span style="font-weight:700;color:${totalReceita>=totalGasto?"#16a34a":"#dc2626"}">${fmt(totalReceita-totalGasto)}</span>
      </div>
    </div>`;

  // Pizza gastos
  let pieSlices="",legItems="",angle=0;
  const byCat={};
  txs.forEach(t=>{ byCat[t.categoria]=(byCat[t.categoria]||0)+t.valor; });
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  catArr.forEach(([name,value])=>{
    const pct=value/totalGasto;
    const a1=angle*Math.PI*2, a2=(angle+pct)*Math.PI*2;
    const x1=Math.cos(a1),y1=Math.sin(a1),x2=Math.cos(a2),y2=Math.sin(a2);
    const large=pct>.5?1:0;
    const cor=CATS[name]?.cor||"#6b7280";
    const R=0.9,r=0.45;
    pieSlices+=`<path d="M${R*x1},${R*y1} A${R},${R} 0 ${large} 1 ${R*x2},${R*y2} L${r*x2},${r*y2} A${r},${r} 0 ${large} 0 ${r*x1},${r*y1} Z" fill="${cor}"/>`;
    legItems+=`<div class="pie-legend-item"><div class="pie-dot" style="background:${cor}"></div>${CATS[name]?.icone} ${name} (${(pct*100).toFixed(1)}%)</div>`;
    angle+=pct;
  });

  // Barras gastos
  const maxCat=catArr.length?catArr[0][1]:1;
  const barsHtml=catArr.map(([name,value])=>{
    const pct=(value/maxCat*100).toFixed(0);
    const cor=CATS[name]?.cor||"#6b7280";
    const ico=CATS[name]?.icone||"📦";
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:90px;font-size:12px;text-align:right;flex-shrink:0;color:#374151">${ico} ${name}</div>
      <div style="flex:1;background:#f3f4f6;border-radius:99px;height:24px">
        <div style="width:${pct}%;min-width:1%;height:100%;border-radius:99px;background:${cor};display:flex;align-items:center;justify-content:flex-end;padding-right:8px">
          <span style="font-size:11px;color:white;font-weight:600">${fmt(value)}</span>
        </div>
      </div>
    </div>`;
  }).join("");

  // Área por dia
  const byDay={};
  txs.forEach(t=>{ const d=fmtD(t.data); byDay[d]=(byDay[d]||0)+t.valor; });
  const days=Object.entries(byDay);
  let areaSvg="";
  if(days.length){
    const W=460,H=140,pl=50,pr=20,pt=20,pb=30;
    const maxDay=Math.max(...days.map(d=>d[1]));
    const pts=days.map(([d,v],i)=>({
      x:pl+(i/(Math.max(days.length-1,1)))*(W-pl-pr),
      y:pt+(1-v/maxDay)*(H-pt-pb), d, v
    }));
    const aPath=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(" ")
      +` L${pts[pts.length-1].x},${H-pb} L${pts[0].x},${H-pb} Z`;
    areaSvg=`<div class="card"><h2>Gastos por Dia</h2><div class="chart-wrap">
      <svg width="${W}" height="${H}" style="display:block">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7c3aed" stop-opacity=".3"/>
          <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${aPath}" fill="url(#ag)"/>
        <polyline points="${pts.map(p=>`${p.x},${p.y}`).join(" ")}" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#7c3aed"/>`).join("")}
        ${pts.map(p=>`<text x="${p.x}" y="${H-8}" text-anchor="middle" font-size="11" fill="#9ca3af">${p.d}</text>`).join("")}
        ${pts.map(p=>`<text x="${p.x}" y="${p.y-10}" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="600">R$${p.v.toFixed(0)}</text>`).join("")}
        <line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="#e5e7eb"/>
        <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#e5e7eb"/>
      </svg>
    </div></div>`;
  }

  document.getElementById("sec-grafico").innerHTML = `
    ${recVsGastoHtml}
    ${catArr.length?`
    <div class="card">
      <h2>Distribuição dos Gastos</h2>
      <div style="display:flex;justify-content:center">
        <svg width="200" height="200" viewBox="-1 -1 2 2" style="transform:rotate(-90deg)">${pieSlices}</svg>
      </div>
      <div class="pie-legend">${legItems}</div>
    </div>
    <div class="card"><h2>Gastos por Categoria</h2>${barsHtml}</div>`:""}
    ${areaSvg}`;
}

// ── INTERAÇÕES ────────────────────────────────────────────────────────────────
function setFiltro(cat)    { filtroAtivo=cat;  renderGastos(txDoMes(mesAtual())); }
function setBusca(v)       { busca=v;         renderGastos(txDoMes(mesAtual())); }
function setViewMode(mode) { viewMode=mode;   renderGastos(txDoMes(mesAtual())); }
function toggleStack(key){
  if(expandidos.has(key)) expandidos.delete(key); else expandidos.add(key);
  renderGastos(txDoMes(mesAtual()));
}
function showAba(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("visible"));
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  document.getElementById("sec-"+id).classList.add("visible");
  btn.classList.add("active");
}

render();
</script>
</body>
</html>
